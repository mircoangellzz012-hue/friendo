    const u=$('#u').value.trim().toLowerCase(),pw=$('#pw').value;
    if(!/^[a-z0-9._]{3,16}$/.test(u))return fail('Nome utente: da 3 a 16 caratteri, solo lettere, numeri, punto o trattino basso');
    if(pw.length<6)return fail('La password deve avere almeno 6 caratteri');
    $('#go').disabled=true;const email=u+'@friendo.app';
    try{let r;
      if(su){r=await db.auth.signUp({email,password:pw});if(r.error)throw r.error;if(!r.data.session)throw new Error('Su Supabase devi spegnere Confirm email');
        const q=await db.from('profiles').insert({id:r.data.user.id,username:u,name:$('#n').value.trim()||u,code:'FR-'+rnd(4)});if(q.error)throw q.error}
      else{r=await db.auth.signInWithPassword({email,password:pw});if(r.error)throw r.error}
      await loadMe(r.data.user.id);err='';render();
    }catch(e){const m=e.message||'Errore';fail(m.includes('Invalid login')?'Nome utente o password sbagliati':m.includes('already')?'Nome utente già preso':m)}
  };
}
function chats(){
  const rows=[...fr].sort((a,b)=>last(b)-last(a)).map(f=>{const l=(msgs[f.id]||[]).slice(-1)[0],u=unread(f);
    return `<div class="row" data-id="${f.id}">${av(f)}<div class="g"><div class="nm">${esc(f.name)}</div><div class="pv">${l?(l.from_id===me.id?'Tu: ':'')+esc(l.body||(l.media_type==='video'?'Video':'Foto')):'Nessun messaggio'}</div></div><div class="tm">${l?fmt(l.created_at):''}<br>${u?`<span class="bd">${u}</span>`:''}</div></div>`}).join('');
  $('#main').innerHTML=`<div class="top"><h2>Chat</h2></div>${rows?`<div class="list">${rows}</div>`:`<div class="empty">Nessuna conversazione.<br>Cerca un amico nella sezione Persone.</div>`}`;
  document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{open=r.dataset.id;render()});
}
function chatView(){
  const d=$('#tx'),had=d&&document.activeElement===d;if(d)draft=d.value;
  const f=fr.find(x=>x.id===open);if(!f){open=null;return render()}
  $('#nav').style.display='none';lr[f.id]=Date.now();sv('lr',JSON.stringify(lr));
  const mh=m=>`<div class="b ${m.from_id===me.id?'me':''}">${m.media_url?(m.media_type==='video'?`<video src="${esc(m.media_url)}" controls playsinline style="max-width:100%;border-radius:12px;display:block"></video>`:`<img src="${esc(m.media_url)}" alt="Foto" style="max-width:100%;border-radius:12px;display:block">`):''}${m.body?esc(m.body):''}<small>${fmt(m.created_at)}${m.from_id===me.id?tick+tick:''}</small></div>`;
  $('#main').innerHTML=`<div class="top" style="justify-content:flex-start;gap:8px"><button class="ib" id="bk" aria-label="Indietro">${ic('back')}</button>${av(f,'s')}<div class="g"><div class="nm">${esc(f.name)}</div><div class="sub">@${esc(f.username)}</div></div><button class="ib" id="ph" aria-label="Chiamata">${ic('phone')}</button><button class="ib" id="vd" aria-label="Videochiamata">${ic('video')}</button></div>
  <div class="msgs">${(msgs[f.id]||[]).map(mh).join('')}</div><div class="cmp"><button class="ib" id="at" aria-label="Allega">${ic('img')}</button><input id="tx" placeholder="Messaggio" autocomplete="off"><button class="btn" id="sd" aria-label="Invia">${ic('send')}</button></div>`;
  $('#tx').value=draft;if(had)$('#tx').focus();$('#main').scrollTop=1e6;
  $('#bk').onclick=()=>{open=null;draft='';render()};$('#ph').onclick=()=>startCall(f,0);$('#vd').onclick=()=>startCall(f,1);
  const go=async()=>{const v=$('#tx').value.trim();if(!v)return;$('#tx').value='';draft='';const r=await db.from('messages').insert({from_id:me.id,to_id:f.id,body:v}).select().single();if(r.error)return toast('Invio non riuscito');add(r.data);chatView()};
  $('#sd').onclick=go;$('#tx').onkeydown=e=>{if(e.key==='Enter')go()};
  $('#at').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*,video/*';i.onchange=async()=>{const fl=i.files[0];if(!fl)return;toast('Invio in corso...');
    try{const vid=fl.type.startsWith('video');const url=vid?await up(fl,fl.name.split('.').pop()||'mp4',fl.type):await up(await imgBlob(fl,1280),'jpg','image/jpeg');
      const r=await db.from('messages').insert({from_id:me.id,to_id:f.id,media_url:url,media_type:vid?'video':'image'}).select().single();if(r.error)throw r.error;add(r.data);chatView()}
    catch(e){toast('Invio non riuscito: '+(e.message||''))}};i.click()};
}
async function find(){const q=($('#q').value||'').trim().replace(/^@/,'').replace(/[^a-zA-Z0-9._-]/g,'');query=q;if(!q){res=null;return people()}
  const {data}=await db.from('profiles').select('*').or(`username.ilike.${q.toLowerCase()}%,code.eq.${q.toUpperCase()}`).neq('id',me.id).limit(10);res=data||[];people()}
function people(){
  const rq=inc.length?`<h3 style="font-size:18px;margin:0 0 8px">Richieste di amicizia</h3><div class="list" style="margin-bottom:14px">${inc.map(p=>`<div class="row" style="cursor:default">${av(p)}<div class="g"><div class="nm">${esc(p.name)}</div><div class="pv">@${esc(p.username)}</div></div><button class="btn" style="padding:8px 12px" data-ok="${p.fid}">Accetta</button><button class="ib" data-no="${p.fid}" aria-label="Rifiuta">${ic('back').replace('M15 5l-7 7 7 7','M6 6l12 12M18 6L6 18')}</button></div>`).join('')}</div>`:'';
  let r='';
  if(res)r=res.length?`<div class="list">${res.map(d=>{const a=fr.some(f=>f.id===d.id),p=pend.includes(d.id);return `<div class="row" style="cursor:default">${av(d)}<div class="g"><div class="nm">${esc(d.name)}</div><div class="pv">@${esc(d.username)}</div></div><button class="btn" style="padding:8px 14px" data-a="${d.id}" ${a||p?'disabled':''}>${a?'Amici':p?'Inviata':'Aggiungi'}</button></div>`}).join('')}</div>`:`<div class="empty">Nessun utente trovato per "${esc(query)}".</div>`;
  else r=`<div class="empty">Cerca per nome utente o codice amico.</div>`;
  $('#main').innerHTML=`<div class="top"><h2>Persone</h2></div>${rq}<div class="code"><div><div class="sub">Il tuo codice amico</div><b>${me.code}</b></div><button class="ib" id="cp" aria-label="Copia codice">${ic('copy')}</button></div>
  <div class="sr"><input id="q" placeholder="Cerca @utente o codice" value="${esc(query)}" autocomplete="off" autocapitalize="none"><button class="btn" id="sr" aria-label="Cerca">${ic('search')}</button></div>${r}`;
  $('#sr').onclick=find;$('#q').onkeydown=e=>{if(e.key==='Enter')find()};
  $('#cp').onclick=()=>{try{navigator.clipboard.writeText(me.code).then(()=>toast('Codice copiato'),()=>toast('Copia non disponibile'))}catch(e){toast('Copia non disponibile')}};
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const r2=await db.from('friendships').insert({from_id:me.id,to_id:b.dataset.a});if(r2.error)return toast('Richiesta non inviata');toast('Richiesta inviata');await loadAll();people()});
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{await db.from('friendships').update({status:'accepted'}).eq('id',b.dataset.ok);await loadAll();render()});
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{await db.from('friendships').delete().eq('id',b.dataset.no);await loadAll();render()});
}
async function upd(o){const r=await db.from('profiles').update(o).eq('id',me.id).select().single();if(r.error)return toast('Errore: '+r.error.message);me=r.data;profile()}
function profile(){
  $('#main').innerHTML=`<div class="top"><h2>Profilo</h2></div><div class="pc"><div class="bn" style="background-image:${me.banner?`url(${esc(me.banner)})`:BN[0]}"><button class="cam" id="cb" aria-label="Cambia banner">${ic('cam')}</button></div>
  <div class="pb"><div style="position:relative;width:84px">${av(me,'l')}<button class="ec" id="cp2" aria-label="Cambia foto">${ic('pen')}</button></div><h3 style="margin-top:8px">${esc(me.name)}</h3><div class="sub">@${esc(me.username)} · ${me.code}</div><p style="margin:8px 0 0">${me.bio?esc(me.bio):'<span class="sub">Nessuna bio</span>'}</p></div></div>
  <label for="nm2">Nome</label><input id="nm2" maxlength="24" value="${esc(me.name)}"><label for="bio">Bio</label><textarea id="bio" rows="2" maxlength="80" placeholder="Scrivi qualcosa su di te">${esc(me.bio||'')}</textarea>
  <button class="btn w" id="sv" style="margin-top:14px">Salva modifiche</button><button class="btn o w" id="lo" style="margin-top:8px">Esci</button>`;
  $('#cp2').onclick=()=>pickFile(async f=>{toast('Caricamento...');try{upd({avatar:await up(await imgBlob(f,256),'jpg','image/jpeg')})}catch(e){toast('Caricamento non riuscito')}});
  $('#cb').onclick=()=>pickFile(async f=>{toast('Caricamento...');try{upd({banner:await up(await imgBlob(f,900),'jpg','image/jpeg')})}catch(e){toast('Caricamento non riuscito')}});
  $('#sv').onclick=()=>upd({name:$('#nm2').value.trim()||me.name,bio:$('#bio').value.slice(0,80)});
  $('#lo').onclick=async()=>{await db.removeAllChannels();await db.auth.signOut();me=null;fr=[];msgs={};open=null;tab='chat';render()};
}

/* Chiamate WebRTC: il server serve solo per scambiare i segnali */
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
const sig=(to,data)=>db.from('signals').insert({from_id:me.id,to_id:to,data});
function callUI(f,vid,txt,acc){
  const o=document.createElement('div');o.className='call';
  o.innerHTML=`<video class="rv" id="rv" autoplay playsinline></video><video class="lv" id="lv" autoplay playsinline muted ${vid?'':'hidden'}></video><div class="ct">${av(f,'l')}<h3>${esc(f.name)}</h3><div id="cst" style="color:#B8BBD0">${txt}</div></div><div class="cb">${acc?`<button class="ib" id="ac" style="background:#1DB954" aria-label="Rispondi">${ic('phone')}</button>`:''}<button class="ib hg" id="hg" aria-label="Termina">${ic('phone')}</button></div>`;
  document.body.appendChild(o);o.querySelector('#hg').onclick=()=>endCall(1);return o}
async function flush(){while(cur&&cur.q.length)await cur.pc.addIceCandidate(cur.q.shift()).catch(()=>{})}
async function setup(f,vid,offer){
  const st=await navigator.mediaDevices.getUserMedia({audio:true,video:!!vid});
  if(!cur){st.getTracks().forEach(t=>t.stop());return}
  cur.st=st;$('#lv').srcObject=st;
  const hg=$('#hg');
  const mk=(id,icn,kind)=>{const b=document.createElement('button');b.className='ib';b.id=id;b.innerHTML=ic(icn);b.onclick=()=>{st[kind]().forEach(t=>t.enabled=!t.enabled);b.classList.toggle('off')};hg.before(b)};
  mk('cm','mic','getAudioTracks');if(vid)mk('cc','video','getVideoTracks');
  const pc=cur.pc=new RTCPeerConnection(ICE);st.getTracks().forEach(t=>pc.addTrack(t,st));
  pc.onicecandidate=e=>{if(e.candidate)sig(f.id,{t:'ice',c:e.candidate})};
  pc.ontrack=e=>{$('#rv').srcObject=e.streams[0]};
  pc.onconnectionstatechange=()=>{const s=pc.connectionState;if(s==='connected'&&cur&&!cur.t0){cur.t0=Date.now();cur.tm=setInterval(()=>{const x=Math.floor((Date.now()-cur.t0)/1000),e=$('#cst');if(e)e.textContent=String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')},1000)}if(s==='failed')endCall(1)};
  if(offer){await pc.setRemoteDescription(offer);await flush();const a=await pc.createAnswer();await pc.setLocalDescription(a);sig(f.id,{t:'answer',sdp:a})}
  else{const o=await pc.createOffer();await pc.setLocalDescription(o);sig(f.id,{t:'offer',sdp:o,video:!!vid})}
}
async function startCall(f,vid){
  if(cur)return;cur={f,vid,q:[],o:callUI(f,vid,vid?'Videochiamata in corso...':'Chiamata in corso...')};
  setTimeout(()=>{if(cur&&cur.f===f&&!cur.t0)endCall(1)},45000);
  try{await setup(f,vid)}catch(e){toast('Microfono o fotocamera non disponibili');endCall(1)}
}
async function onSig(s){
  const d=s.data;db.from('signals').delete().eq('id',s.id).then(()=>{});
  if(d.t==='offer'){
    if(cur){sig(s.from_id,{t:'end'});return}
    const f=fr.find(x=>x.id===s.from_id);if(!f)return;
    cur={f,vid:d.video,q:[],inc:1,o:callUI(f,d.video,d.video?'Videochiamata in arrivo':'Chiamata in arrivo',1)};
    $('#ac').onclick=async()=>{$('#ac').remove();$('#cst').textContent='Connessione...';try{await setup(f,d.video,d.sdp)}catch(e){toast('Microfono o fotocamera non disponibili');endCall(1)}};
  }else if(d.t==='answer'){if(cur&&cur.pc){await cur.pc.setRemoteDescription(d.sdp);flush()}}
  else if(d.t==='ice'){if(cur){if(cur.pc&&cur.pc.remoteDescription)cur.pc.addIceCandidate(d.c).catch(()=>{});else cur.q.push(d.c)}}
  else if(d.t==='end'){if(cur&&cur.f.id===s.from_id)endCall(0)}
}
function endCall(send){
  if(!cur)return;const c=cur;cur=null;clearInterval(c.tm);
  if(c.st)c.st.getTracks().forEach(t=>t.stop());if(c.pc)c.pc.close();c.o.remove();
  if(send)sig(c.f.id,{t:'end'});
  if(!c.inc&&c.pc){const s=c.t0?Math.floor((Date.now()-c.t0)/1000):0;
    db.from('messages').insert({from_id:me.id,to_id:c.f.id,body:(c.vid?'Videochiamata':'Chiamata')+(c.t0?' · '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):' · senza risposta')}).select().single().then(r=>{if(r.data)add(r.data);ref()})}
  ref();
}
(async()=>{
  try{const {data}=await db.auth.getSession();if(data.session)await loadMe(data.session.user.id)}catch(e){err='Non riesco a collegarmi al server'}
  const c=new URLSearchParams(location.search).get('code');
  if(c&&me){tab='music';await spExchange(c)}else if(sp.tok)spTop();
  render();
})();
</script></body></html>
